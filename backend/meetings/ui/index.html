<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BATUHAN — Meetings</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;padding:24px;max-width:960px;margin:0 auto}
    h1{color:#00ff88;font-size:1.3rem;letter-spacing:.05em;margin-bottom:4px}
    #clock{color:#555;font-size:.82rem;margin-bottom:20px;letter-spacing:.03em}
    .card{background:#141414;border:1px solid #242424;border-radius:6px;padding:16px;margin-bottom:16px}
    .card h2{color:#00ff88;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
    input,select{background:#0d0d0d;border:1px solid #2e2e2e;color:#e0e0e0;padding:7px 10px;border-radius:4px;font-family:inherit;font-size:.83rem}
    input:focus,select:focus{outline:none;border-color:#00ff88}
    #f-title{flex:2;min-width:160px}
    #f-start{flex:1;min-width:180px}
    #f-desc{flex:3;min-width:200px}
    #f-dur{width:75px}
    #f-tz{width:78px}
    button{background:#00ff88;color:#000;border:none;padding:7px 16px;border-radius:4px;cursor:pointer;font-family:inherit;font-weight:700;font-size:.83rem;white-space:nowrap}
    button:hover{background:#00cc6a}
    button.sec{background:#1e1e1e;color:#aaa;font-weight:400}
    button.sec:hover{background:#2a2a2a;color:#e0e0e0}
    button.del{background:transparent;color:#ff5555;border:1px solid #3a1a1a;padding:3px 9px;font-weight:400}
    button.del:hover{background:#ff5555;color:#000}
    table{width:100%;border-collapse:collapse;font-size:.82rem}
    th{color:#555;text-align:left;padding:5px 8px;border-bottom:1px solid #1e1e1e;font-weight:400;white-space:nowrap}
    td{padding:7px 8px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
    tr:hover td{background:#181818}
    td.trt{color:#00ff88;white-space:nowrap}
    td.et{color:#88aaff;white-space:nowrap}
    td.dur{color:#666;text-align:center}
    .desc-sm{color:#555;font-size:.76rem;margin-top:2px}
    #briefing{background:#0d0d0d;border:1px solid #222;border-radius:4px;padding:12px;white-space:pre-wrap;font-size:.82rem;color:#aaa;margin-top:10px;display:none;line-height:1.6}
    .empty{color:#444;text-align:center;padding:24px;font-style:italic}
    #msg{color:#00ff88;font-size:.78rem;margin-top:6px;min-height:16px}
  </style>
</head>
<body>
  <h1>📋 BATUHAN — Meetings</h1>
  <div id="clock">—</div>

  <div class="card">
    <h2>+ Add Meeting</h2>
    <div class="row">
      <input id="f-title" type="text" placeholder="Meeting title" autocomplete="off">
      <input id="f-start" type="datetime-local">
      <select id="f-tz"><option value="TRT">TRT</option><option value="ET">ET</option></select>
      <input id="f-dur" type="number" value="60" min="5" max="960" title="Duration (minutes)">
      <button onclick="addMeeting()">Add Meeting</button>
    </div>
    <div class="row">
      <input id="f-desc" type="text" placeholder="Description (optional)" autocomplete="off">
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>📅 Upcoming Meetings</h2>
    <table><thead><tr>
      <th>Title</th><th>TRT</th><th>ET</th><th style="text-align:center">Min</th><th></th>
    </tr></thead>
    <tbody id="tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table>
  </div>

  <div class="card">
    <h2>🌙 Tonight's Briefing</h2>
    <button class="sec" onclick="showBriefing()">Load Tomorrow's Agenda</button>
    <div id="briefing"></div>
  </div>

<script>
function updateClock(){
  const now=new Date();
  const trt=now.toLocaleString('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const et=now.toLocaleString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const d=now.toLocaleDateString('en-US',{timeZone:'Europe/Istanbul',weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('clock').textContent=`${d}  ·  TRT ${trt}  ·  ET ${et}`;
}
setInterval(updateClock,1000);updateClock();

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadMeetings(){
  try{
    const r=await fetch('/meetings/');
    const data=await r.json();
    const tb=document.getElementById('tbody');
    if(!data.length){tb.innerHTML='<tr><td colspan="5" class="empty">No upcoming meetings.</td></tr>';return;}
    tb.innerHTML=data.map(m=>`<tr>
      <td><strong>${esc(m.title)}</strong>${m.description?`<div class="desc-sm">${esc(m.description)}</div>`:''}</td>
      <td class="trt">${esc(m.start_trt)}</td>
      <td class="et">${esc(m.start_et)}</td>
      <td class="dur">${m.duration_minutes}</td>
      <td><button class="del" onclick="del(${m.id})">✕</button></td>
    </tr>`).join('');
  }catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="5" class="empty">Could not load meetings.</td></tr>';}
}

async function addMeeting(){
  const title=document.getElementById('f-title').value.trim();
  const start=document.getElementById('f-start').value;
  const tz=document.getElementById('f-tz').value;
  const dur=parseInt(document.getElementById('f-dur').value)||60;
  const desc=document.getElementById('f-desc').value.trim();
  const msg=document.getElementById('msg');
  if(!title||!start){msg.style.color='#ff5555';msg.textContent='Title and start time are required.';return;}
  msg.style.color='#555';msg.textContent='Saving…';
  try{
    const r=await fetch('/meetings/',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,description:desc||null,start_time:start,duration_minutes:dur,timezone:tz})});
    if(r.ok){
      msg.style.color='#00ff88';msg.textContent='Meeting added ✓';
      document.getElementById('f-title').value='';document.getElementById('f-desc').value='';document.getElementById('f-start').value='';
      loadMeetings();
    }else{const e=await r.json();msg.style.color='#ff5555';msg.textContent='Error: '+(e.detail||JSON.stringify(e));}
  }catch(e){msg.style.color='#ff5555';msg.textContent='Network error.';}
}

async function del(id){
  if(!confirm('Delete this meeting?'))return;
  await fetch(`/meetings/${id}`,{method:'DELETE'});
  loadMeetings();
}

async function showBriefing(){
  const div=document.getElementById('briefing');
  div.style.display='block';div.textContent='Loading…';
  try{
    const r=await fetch('/meetings/tomorrow');
    const data=await r.json();
    if(!data.length){div.textContent='No meetings tomorrow. 🎉';return;}
    div.textContent='🌙 Yarın:\n'+data.map(m=>`  • ${m.title} — ${m.start_trt.split(' ').slice(3).join(' ')} / ${m.start_et}  (${m.duration_minutes} min)`).join('\n');
  }catch(e){div.textContent='Could not load.';}
}

loadMeetings();
</script>
</body>
</html>
